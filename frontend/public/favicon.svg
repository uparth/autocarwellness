<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orange circle background -->
  <circle cx="32" cy="32" r="32" fill="#F97316"/>

  <!-- Car body (side view) -->
  <rect x="10" y="32" width="44" height="12" rx="3" fill="white"/>

  <!-- Car cabin/roof -->
  <path d="M18 32 L22 22 L42 22 L46 32 Z" fill="white"/>

  <!-- Windshield cutout -->
  <path d="M23 32 L26 25 L38 25 L41 32 Z" fill="#F97316"/>

  <!-- Left wheel -->
  <circle cx="19" cy="44" r="5" fill="#F97316"/>
  <circle cx="19" cy="44" r="2.5" fill="white"/>

  <!-- Right wheel -->
  <circle cx="45" cy="44" r="5" fill="#F97316"/>
  <circle cx="45" cy="44" r="2.5" fill="white"/>

  <!-- Headlight -->
  <rect x="52" y="35" width="4" height="3" rx="1" fill="#FED7AA"/>

  <!-- Tail light -->
